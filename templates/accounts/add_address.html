{% extends 'base.html' %}

{% block title %}Add Address - NEYO{% endblock %}

{% block content %}
<section class="bg-gradient-to-r from-neyo-primary to-gray-800 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold text-[#8b4d56] text-center">Add New Address</h1>
    </div>
</section>

<section class="py-12 bg-gray-50">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-lg shadow-md p-8">
            <form method="post" action="{% url 'accounts:add_address' %}">
                {% csrf_token %}
                
                <input type="hidden" name="type" value="{{ request.GET.type|default:'shipping' }}">
                
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-neyo-primary">
                        {% if request.GET.type == 'billing' %}
                            <i class="fas fa-file-invoice mr-2"></i>Billing Address
                        {% else %}
                            <i class="fas fa-shipping-fast mr-2"></i>Shipping Address
                        {% endif %}
                    </h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-gray-700 mb-2">
                            First Name *
                        </label>
                        <input type="text" 
                               id="first_name" 
                               name="first_name" 
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="last_name" class="block text-sm font-medium text-gray-700 mb-2">
                            Last Name *
                        </label>
                        <input type="text" 
                               id="last_name" 
                               name="last_name" 
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent">
                    </div>
                </div>
                
                <div class="mb-6">
                    <label for="company" class="block text-sm font-medium text-gray-700 mb-2">
                        Company (Optional)
                    </label>
                    <input type="text" 
                           id="company" 
                           name="company"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent">
                </div>
                
                <div class="mb-6">
                    <label for="address_line_1" class="block text-sm font-medium text-gray-700 mb-2">
                        Address Line 1 *
                    </label>
                    <input type="text" 
                           id="address_line_1" 
                           name="address_line_1" 
                           required
                           placeholder="Street address, P.O. box"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent">
                </div>
                
                <div class="mb-6">
                    <label for="address_line_2" class="block text-sm font-medium text-gray-700 mb-2">
                        Address Line 2 (Optional)
                    </label>
                    <input type="text" 
                           id="address_line_2" 
                           name="address_line_2"
                           placeholder="Apartment, suite, unit"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label for="city" class="block text-sm font-medium text-gray-700 mb-2">
                            City *
                        </label>
                        <input type="text" 
                               id="city" 
                               name="city" 
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="state" class="block text-sm font-medium text-gray-700 mb-2">
                            State *
                        </label>
                        <input type="text" 
                               id="state" 
                               name="state" 
                               required
                               placeholder="e.g. NY"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="postal_code" class="block text-sm font-medium text-gray-700 mb-2">
                            ZIP Code *
                        </label>
                        <input type="text" 
                               id="postal_code" 
                               name="postal_code" 
                               required
                               placeholder="12345"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent">
                    </div>
                </div>
                
                <div class="mb-6">
                    <label for="country" class="block text-sm font-medium text-gray-700 mb-2">
                        Country *
                    </label>
                    <select id="country" 
                            name="country" 
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent">
                        <option value="United States">United States</option>
                        <option value="Canada">Canada</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Australia">Australia</option>
                    </select>
                </div>
                
                <div class="mb-6">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" 
                               name="is_default"
                               class="w-5 h-5 text-neyo-primary rounded">
                        <span class="ml-3 text-gray-700">Set as default address</span>
                    </label>
                </div>
                
                <div class="flex gap-4">
                    <a href="{% url 'accounts:profile' %}" 
                       class="flex-1 bg-white border-2 border-gray-300 text-gray-700 py-3 px-6 rounded-lg font-semibold text-center hover:bg-gray-50 transition-colors">
                        Cancel
                    </a>
                    
                    <button type="submit"
                            class="group flex-1 bg-gradient-to-r from-[#8b4d56] to-[#9d5c66] text-white py-3 px-6 rounded-xl font-semibold shadow-md transition-all duration-300 hover:from-[#733f47] hover:to-[#8b4d56] hover:shadow-xl hover:-translate-y-1 active:translate-y-0 active:shadow-lg">
                        <i class="fas fa-save mr-2 transition-transform duration-300 group-hover:scale-110"></i>
                        Save Address
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
