{% extends 'base.html' %}

{% block title %}Login - NEYO{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gray-50 py-12">
    <div class="max-w-md w-full px-4">
        <div class="bg-white rounded-lg shadow-xl p-8">
            <!-- Logo/Header -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-neyo-primary mb-2">NEYO</h1>
                <p class="text-gray-600">Welcome back! Please login to your account.</p>
            </div>
            
            <!-- Login Form -->
            <form method="post" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                
                <div class="mb-6">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2"></i>Username
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required
                           autofocus
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent transition-colors">
                </div>
                
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock mr-2"></i>Password
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary focus:border-transparent transition-colors">
                </div>
                

                <button type="submit"
                        class="w-full bg-[#8b4d56] text-white py-3 px-6 rounded-lg font-semibold transition-all duration-300 hover:bg-[#733f47] hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Login
                </button>

                
                <!-- Google Login (placeholder) -->
                <a href="{% url 'accounts:google_login' %}" style="margin-top: 1rem;"
                   class="w-full flex items-center justify-center bg-white border-2 border-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-50 transition-colors">
                    <i class="fab fa-google mr-2 text-red-500"></i> Continue with Google
                </a>
            </form>
            
            <!-- Links -->
            <div class="mt-6 text-center space-y-2">
                <a href="{% url 'core:home' %}" class="block text-neyo-accent hover:underline text-sm">
                    <i class="fas fa-arrow-left mr-1"></i>Back to Home
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
