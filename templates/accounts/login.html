{% extends 'base.html' %}

{% block title %}Login - NEYO{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gray-50 py-12">
    <div class="max-w-md w-full px-4">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-3xl font-bold text-center text-neyo-primary mb-8">Login to NEYO</h2>
            
            <form method="post" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                
                <div class="mb-6">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        Username
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary">
                </div>
                
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-neyo-primary">
                </div>
                
                <button type="submit" 
                        class="w-full bg-neyo-primary text-white py-3 rounded-lg font-semibold hover:bg-gray-800 transition-colors">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="{% url 'core:home' %}" class="text-neyo-accent hover:underline">
                    Back to Home
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
